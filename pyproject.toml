[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dg2cd-net"
version = "0.1.0"
description = "Implementation of DG2CD-Net (Rathore et al., CVPR 2025)"
requires-python = ">=3.10"

dependencies = [
    "timm>=1.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
synth = ["diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33"]
lora  = ["peft>=0.12"]
dev   = ["pytest>=8.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["dg2cd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"