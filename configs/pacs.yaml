seed: 0
device: cuda
output_dir: runs/pacs

# Settings for the dataset and data loader
dataset:
  name: pacs
  root: data/pacs
  image_size: 224
  domains: [art_painting, cartoon, photo, sketch]
  source: photo
  class_names: [dog, elephant, giraffe, guitar, horse, house, person]
  known_classes: [dog, elephant, giraffe, guitar]

# Settings for the backbone and LoRA modules
backbone:
  arch: vit_base_patch16_224.dino
  feature: cls
  embed_dim: 768
  trainable_blocks: [-1]
  lora:
    enabled: false
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: [qkv, proj, fc1, fc2]

# Settings for the classifier and loss function
episodic:
  n_global: 10
  n_episodes: 6
  local_epochs: 8
  batch_size: 128
  optimizer: sgd
  lr: 0.1
  scheduler: cosine
  momentum: 0.9
  weight_decay: 5.0e-5
  episode_known_range: [2, 3]
  episode_source_fraction: 1.0
  grad_clip: 1.0

# Settings for the loss function
losses: 
  temperature: 0.07
  adv_alpha: 0.5
  margin_m: 0.7
  lambda_da: 0.2
  w_con_u: 0.65
  w_con_s: 0.35
  mu_da: 1.0

# Settings for the synthetic data generation 
synthetic:
  generator: augmentation
  cache_dir: data/PACS_synth
  train_domains: [rainy, snowy, white, black, forest, beach]
  valid_domains: [summer, gray, urban]
  instructpix2pix:
    model_id: timbrooks/instruct-pix2pix
    num_inference_steps: 10
    image_guidance_scale: 1.0
    guidance_scale: 7.5
    prompt_template: "Add {descriptor} scene to the image."

# Settings for evaluation
eval:
  k_estimation: brent
  k_min: null
  k_max: 1000
  kmeans_n_init: 10
  num_runs: 3
  k_estimation_n_init: 3

# Settings for data augmentation
augmentation:
  rotation_degrees: 15
  translate: [0.1, 0.1]
  scale: [0.9, 1.1]
  horizontal_flip: 0.5